[package]
name = "pyrax-wallet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "PYRAX wallet library - key management, signing, HD derivation"

[lib]
name = "pyrax_wallet"
path = "src/lib.rs"

[dependencies]
# Cryptography
k256 = { version = "0.13", features = ["ecdsa", "schnorr"] }
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["sha2"] }
rand = "0.8"
rand_chacha = "0.3"

# BIP39/BIP32
bip39 = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Encryption
aes-gcm = "0.10"
argon2 = "0.5"

# Error handling
thiserror = "1.0"

# Types
ethereum-types = "0.14"
tiny-keccak = { version = "2.0", features = ["keccak"] }
rlp = "0.5"

# Misc
zeroize = { version = "1.7", features = ["derive"] }
secrecy = "0.8"

[dev-dependencies]
tempfile = "3.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_Security_Cryptography"] }
