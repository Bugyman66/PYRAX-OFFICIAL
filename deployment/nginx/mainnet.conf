# PYRAX Mainnet Nginx Configuration
# Cloudflare SSL (Full Strict Mode) - Production

# Cloudflare IP ranges for real IP restoration
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
real_ip_header CF-Connecting-IP;

# Rate limiting zones (strictest for mainnet)
limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Main website - pyrax.org
server {
    listen 443 ssl http2;
    server_name pyrax.org www.pyrax.org;

    ssl_certificate /etc/ssl/cloudflare/pyrax.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pyrax.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

    root /var/www/pyrax.org;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Explorer - explorer.pyrax.org
server {
    listen 443 ssl http2;
    server_name explorer.pyrax.org;

    ssl_certificate /etc/ssl/cloudflare/pyrax.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pyrax.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# RPC - rpc.pyrax.org
server {
    listen 443 ssl http2;
    server_name rpc.pyrax.org;

    ssl_certificate /etc/ssl/cloudflare/pyrax.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pyrax.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strict rate limiting for production RPC
    limit_req zone=rpc_limit burst=40 nodelay;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:8545;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type "application/json";
    }

    location /ws {
        proxy_pass http://127.0.0.1:8546;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

# API - api.pyrax.org
server {
    listen 443 ssl http2;
    server_name api.pyrax.org;

    ssl_certificate /etc/ssl/cloudflare/pyrax.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pyrax.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    limit_req zone=api_limit burst=60 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name pyrax.org www.pyrax.org *.pyrax.org;
    return 301 https://$host$request_uri;
}
