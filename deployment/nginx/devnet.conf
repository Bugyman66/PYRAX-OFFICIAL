# PYRAX Devnet Nginx Configuration
# Cloudflare SSL (Full Strict Mode)

# Cloudflare IP ranges for real IP restoration
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
real_ip_header CF-Connecting-IP;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=faucet_limit:10m rate=1r/m;

# Explorer - explorer.dev.pyrax.org
server {
    listen 443 ssl http2;
    server_name explorer.dev.pyrax.org;

    # Cloudflare Origin Certificate
    ssl_certificate /etc/ssl/cloudflare/pyrax.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pyrax.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# RPC - rpc.dev.pyrax.org
server {
    listen 443 ssl http2;
    server_name rpc.dev.pyrax.org;

    ssl_certificate /etc/ssl/cloudflare/pyrax.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pyrax.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Rate limiting for RPC
    limit_req zone=rpc_limit burst=100 nodelay;

    # CORS headers for RPC
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:8545;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type "application/json";
    }

    # WebSocket endpoint
    location /ws {
        proxy_pass http://127.0.0.1:8546;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

# API - api.dev.pyrax.org
server {
    listen 443 ssl http2;
    server_name api.dev.pyrax.org;

    ssl_certificate /etc/ssl/cloudflare/pyrax.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pyrax.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    limit_req zone=api_limit burst=200 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Faucet - faucet.dev.pyrax.org
server {
    listen 443 ssl http2;
    server_name faucet.dev.pyrax.org;

    ssl_certificate /etc/ssl/cloudflare/pyrax.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pyrax.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strict rate limiting for faucet
    limit_req zone=faucet_limit burst=5 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP to HTTPS redirect (Cloudflare handles this, but just in case)
server {
    listen 80;
    server_name *.dev.pyrax.org dev.pyrax.org;
    return 301 https://$host$request_uri;
}
