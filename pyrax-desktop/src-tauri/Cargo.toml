[package]
name = "pyrax-desktop"
version = "0.1.1"
description = "PYRAX Desktop Application"
authors = ["PYRAX Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "window-all", "dialog-all", "fs-all", "path-all", "process-all", "notification-all", "updater", "global-shortcut-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
tracing = "0.1"
tracing-subscriber = "0.3"
directories = "4.0"
parking_lot = "0.12"
thiserror = "1.0"
which = "5.0"
num_cpus = "1.16"
blake3 = "1.5"
hex = "0.4"
libloading = "0.8"
rand = "0.8"
open = "5.0"
bincode = "1.3"

# Local workspace dependencies
pyrax-wallet = { path = "../../pyrax-wallet" }
pyrax-node = { path = "../../pyrax-node" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
