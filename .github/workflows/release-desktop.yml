name: Release Desktop App

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/desktop-v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `desktop-v${{ steps.get-version.outputs.version }}`,
              name: `PYRAX Desktop v${{ steps.get-version.outputs.version }}`,
              body: `## PYRAX Desktop v${{ steps.get-version.outputs.version }}\n\nDownload the installer for your platform below.\n\n### Changes\n- See commit history for changes`,
              draft: true,
              prerelease: false
            });
            core.setOutput('release_id', data.id);
            core.setOutput('upload_url', data.upload_url);

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pyrax-desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build pyrax-node binary
        run: cargo build --release -p pyrax-node

      - name: Copy pyrax-node to resources
        run: |
          mkdir -p pyrax-desktop/src-tauri/resources
          Copy-Item target/release/pyrax-node.exe pyrax-desktop/src-tauri/resources/
        shell: pwsh

      - name: Install frontend dependencies
        working-directory: pyrax-desktop
        run: npm ci

      - name: Update version in tauri.conf.json
        working-directory: pyrax-desktop/src-tauri
        run: |
          $content = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          $content.package.version = "${{ needs.create-release.outputs.version }}"
          $content | ConvertTo-Json -Depth 100 | Set-Content tauri.conf.json
        shell: pwsh

      - name: Update version in Cargo.toml
        working-directory: pyrax-desktop/src-tauri
        run: |
          (Get-Content Cargo.toml) -replace 'version = "0.1.0"', 'version = "${{ needs.create-release.outputs.version }}"' | Set-Content Cargo.toml
        shell: pwsh

      - name: Download Visual C++ Redistributable
        shell: pwsh
        run: |
          Write-Host "Downloading Visual C++ Redistributable for bundling..."
          $resourcesDir = "pyrax-desktop/src-tauri/resources"
          $vcRedistUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $vcRedistPath = "$resourcesDir/vc_redist.x64.exe"
          Write-Host "Downloading from $vcRedistUrl..."
          Invoke-WebRequest -Uri $vcRedistUrl -OutFile $vcRedistPath -UseBasicParsing
          $size = (Get-Item $vcRedistPath).Length
          Write-Host "Downloaded VC++ Redistributable: $vcRedistPath ($size bytes)"

      - name: Write signing key to file
        shell: pwsh
        run: |
          $keyContent = "${{ secrets.TAURI_PRIVATE_KEY }}"
          if ([string]::IsNullOrEmpty($keyContent)) {
            Write-Error "TAURI_PRIVATE_KEY secret is not set!"
            exit 1
          }
          # Write key to file (Tauri can read from file path)
          $keyContent | Out-File -FilePath "$env:RUNNER_TEMP/tauri.key" -Encoding utf8 -NoNewline
          Write-Host "Key written to $env:RUNNER_TEMP/tauri.key"
          Write-Host "Key length: $($keyContent.Length) chars"

      - name: Build Tauri app with signing
        working-directory: pyrax-desktop
        shell: pwsh
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          Write-Host "Building Tauri app with signing enabled..."
          Write-Host "TAURI_PRIVATE_KEY env var length: $($env:TAURI_PRIVATE_KEY.Length)"
          Write-Host "TAURI_KEY_PASSWORD length: $($env:TAURI_KEY_PASSWORD.Length)"
          npm run tauri build
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tauri build failed with exit code $LASTEXITCODE"
            exit 1
          }
          Write-Host "Tauri build completed successfully"
          
      - name: Upload bundle files to release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $workspace = $env:GITHUB_WORKSPACE
          
          Write-Host "Workspace: $workspace"
          Write-Host "Version: $version"
          
          # Use absolute path to bundle directory
          $bundleDir = Join-Path $workspace "target\release\bundle\nsis"
          
          Write-Host "Looking for bundle at: $bundleDir"
          
          if (-not (Test-Path $bundleDir)) {
            Write-Host "ERROR: Bundle directory not found!"
            Write-Host "Listing workspace root:"
            Get-ChildItem -Path $workspace -Depth 1 | ForEach-Object { Write-Host $_.FullName }
            Write-Host ""
            Write-Host "Looking for any 'target' directory:"
            Get-ChildItem -Path $workspace -Directory -Recurse -Filter "target" -Depth 3 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          
          Write-Host "Bundle directory found! Contents:"
          Get-ChildItem -Path $bundleDir | ForEach-Object {
            Write-Host "  $($_.Name) - $($_.Length) bytes"
          }
          
          # Upload each file type
          $uploaded = 0
          
          # Upload .exe installer
          $exeFiles = Get-ChildItem -Path $bundleDir -Filter "*.exe"
          foreach ($exe in $exeFiles) {
            Write-Host "Uploading: $($exe.Name)"
            gh release upload "desktop-v$version" $exe.FullName --clobber
            if ($LASTEXITCODE -eq 0) { $uploaded++ } else { Write-Host "Failed to upload $($exe.Name)" }
          }
          
          # Upload .nsis.zip (for OTA updates)
          $zipFiles = Get-ChildItem -Path $bundleDir -Filter "*.nsis.zip"
          foreach ($zip in $zipFiles) {
            Write-Host "Uploading: $($zip.Name)"
            gh release upload "desktop-v$version" $zip.FullName --clobber
            if ($LASTEXITCODE -eq 0) { $uploaded++ } else { Write-Host "Failed to upload $($zip.Name)" }
          }
          
          # Upload .sig signature files (required for OTA)
          $sigFiles = Get-ChildItem -Path $bundleDir -Filter "*.sig"
          foreach ($sig in $sigFiles) {
            Write-Host "Uploading: $($sig.Name)"
            gh release upload "desktop-v$version" $sig.FullName --clobber
            if ($LASTEXITCODE -eq 0) { $uploaded++ } else { Write-Host "Failed to upload $($sig.Name)" }
          }
          
          if ($uploaded -eq 0) {
            Write-Error "No files were uploaded!"
            exit 1
          }
          
          Write-Host ""
          Write-Host "Successfully uploaded $uploaded file(s) to release"

  publish-release:
    needs: [create-release, build-tauri]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });

  generate-update-manifest:
    needs: [create-release, build-tauri, publish-release]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate and upload update manifest
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const version = '${{ needs.create-release.outputs.version }}';
            const releaseId = ${{ needs.create-release.outputs.release_id }};
            
            // Get release info
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId
            });
            
            console.log('Release assets:', release.assets.map(a => a.name));
            
            // Find installer asset - try .nsis.zip first, then .exe
            let installerAsset = release.assets.find(a => a.name.endsWith('.nsis.zip'));
            let sigAsset = release.assets.find(a => a.name.endsWith('.nsis.zip.sig'));
            
            // Fallback to .exe if .nsis.zip not found
            if (!installerAsset) {
              installerAsset = release.assets.find(a => a.name.endsWith('-setup.exe') || a.name.endsWith('_x64-setup.exe'));
              sigAsset = release.assets.find(a => a.name.endsWith('-setup.exe.sig') || a.name.endsWith('_x64-setup.exe.sig'));
            }
            
            if (!installerAsset) {
              core.setFailed(`No installer asset found in release`);
              return;
            }
            
            console.log('Found installer asset:', installerAsset.name);
            
            let signature = '';
            if (sigAsset) {
              console.log('Found sig asset:', sigAsset.name);
              // Download signature using fetch
              const sigUrl = `https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/releases/assets/${sigAsset.id}`;
              const sigResponse = await fetch(sigUrl, {
                headers: {
                  'Authorization': `token ${process.env.GITHUB_TOKEN}`,
                  'Accept': 'application/octet-stream'
                }
              });
              signature = await sigResponse.text();
              console.log('Signature downloaded, length:', signature.length);
            } else {
              console.log('Warning: No signature file found - OTA updates may not work without signing');
              signature = 'unsigned';
            }
            
            // Create update manifest
            const manifest = {
              version: version,
              notes: `PYRAX Desktop v${version}`,
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: signature.trim(),
                  url: installerAsset.browser_download_url
                }
              }
            };
            
            console.log('Generated manifest:', JSON.stringify(manifest, null, 2));
            
            // Upload manifest to release
            const manifestContent = JSON.stringify(manifest, null, 2);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: 'latest.json',
              data: manifestContent
            });
            
            console.log('Successfully uploaded latest.json to release');
