name: Release Desktop App

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/desktop-v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `desktop-v${{ steps.get-version.outputs.version }}`,
              name: `PYRAX Desktop v${{ steps.get-version.outputs.version }}`,
              body: `## PYRAX Desktop v${{ steps.get-version.outputs.version }}\n\nDownload the installer for your platform below.\n\n### Changes\n- See commit history for changes`,
              draft: true,
              prerelease: false
            });
            core.setOutput('release_id', data.id);
            core.setOutput('upload_url', data.upload_url);

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pyrax-desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build pyrax-node binary
        run: cargo build --release -p pyrax-node

      - name: Copy pyrax-node to resources
        run: |
          mkdir -p pyrax-desktop/src-tauri/resources
          Copy-Item target/release/pyrax-node.exe pyrax-desktop/src-tauri/resources/
        shell: pwsh

      - name: Install frontend dependencies
        working-directory: pyrax-desktop
        run: npm ci

      - name: Update version in tauri.conf.json
        working-directory: pyrax-desktop/src-tauri
        run: |
          $content = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          $content.package.version = "${{ needs.create-release.outputs.version }}"
          $content | ConvertTo-Json -Depth 100 | Set-Content tauri.conf.json
        shell: pwsh

      - name: Update version in Cargo.toml
        working-directory: pyrax-desktop/src-tauri
        run: |
          (Get-Content Cargo.toml) -replace 'version = "0.1.0"', 'version = "${{ needs.create-release.outputs.version }}"' | Set-Content Cargo.toml
        shell: pwsh

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: pyrax-desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });

  generate-update-manifest:
    needs: [create-release, build-tauri, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate and upload update manifest
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const version = '${{ needs.create-release.outputs.version }}';
            const releaseId = ${{ needs.create-release.outputs.release_id }};
            
            // Get release info
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId
            });
            
            console.log('Release assets:', release.assets.map(a => a.name));
            
            // Find installer asset - try .nsis.zip first, then .exe
            let installerAsset = release.assets.find(a => a.name.endsWith('.nsis.zip'));
            let sigAsset = release.assets.find(a => a.name.endsWith('.nsis.zip.sig'));
            
            // Fallback to .exe if .nsis.zip not found
            if (!installerAsset) {
              installerAsset = release.assets.find(a => a.name.endsWith('-setup.exe') || a.name.endsWith('_x64-setup.exe'));
              sigAsset = release.assets.find(a => a.name.endsWith('-setup.exe.sig') || a.name.endsWith('_x64-setup.exe.sig'));
            }
            
            if (!installerAsset) {
              core.setFailed(`No installer asset found in release`);
              return;
            }
            
            console.log('Found installer asset:', installerAsset.name);
            
            let signature = '';
            if (sigAsset) {
              console.log('Found sig asset:', sigAsset.name);
              // Download signature using fetch
              const sigUrl = `https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/releases/assets/${sigAsset.id}`;
              const sigResponse = await fetch(sigUrl, {
                headers: {
                  'Authorization': `token ${process.env.GITHUB_TOKEN}`,
                  'Accept': 'application/octet-stream'
                }
              });
              signature = await sigResponse.text();
              console.log('Signature downloaded, length:', signature.length);
            } else {
              console.log('Warning: No signature file found - OTA updates may not work without signing');
              signature = 'unsigned';
            }
            
            // Create update manifest
            const manifest = {
              version: version,
              notes: `PYRAX Desktop v${version}`,
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: signature.trim(),
                  url: installerAsset.browser_download_url
                }
              }
            };
            
            console.log('Generated manifest:', JSON.stringify(manifest, null, 2));
            
            // Upload manifest to release
            const manifestContent = JSON.stringify(manifest, null, 2);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: 'latest.json',
              data: manifestContent
            });
            
            console.log('Successfully uploaded latest.json to release');
