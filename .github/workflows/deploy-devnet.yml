name: Deploy to Devnet

on:
  push:
    branches:
      - devnet
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DEVNET_SERVER: 209.38.137.105

jobs:
  deploy:
    name: Build and Deploy to Devnet
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.DEVNET_SERVER }} >> ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='target' \
            ./ root@${{ env.DEVNET_SERVER }}:/opt/pyrax/

      - name: Install Docker on Devnet Server
        run: |
          ssh root@${{ env.DEVNET_SERVER }} << 'EOF'
          set -e
          
          if ! command -v docker &> /dev/null; then
            echo "=== INSTALLING DOCKER ==="
            apt-get update
            apt-get install -y ca-certificates curl gnupg
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            chmod a+r /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
            apt-get update
            apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            systemctl enable docker
            systemctl start docker
            echo "Docker installed successfully"
          else
            echo "Docker already installed"
          fi
          EOF

      - name: Configure Firewall for TriStream
        run: |
          ssh root@${{ env.DEVNET_SERVER }} << 'EOF'
          set -e
          
          echo "=== ENSURING DOCKER STARTS ON BOOT ==="
          systemctl enable docker
          systemctl start docker
          
          echo "=== CONFIGURING FIREWALL FOR TRISTREAM ==="
          
          # Install ufw if not present
          apt-get update -qq
          apt-get install -y -qq ufw
          
          # Allow SSH first (important!)
          ufw allow 22/tcp comment 'SSH'
          
          # Allow HTTP and HTTPS for Cloudflare
          ufw allow 80/tcp comment 'HTTP'
          ufw allow 443/tcp comment 'HTTPS'
          
          # Stream A: BLAKE3 PoW (internal via nginx)
          # Port 8545 is internal only
          
          # Stream B: KAWPOW GPU Mining - Stratum
          ufw allow 3333/tcp comment 'Stream B Stratum (GPU Mining)'
          
          # Stream C: ZK Staking (internal via nginx)
          # Port 8547 is internal only
          
          # Blockchain P2P ports
          ufw allow 30303/tcp comment 'P2P TCP'
          ufw allow 30304/udp comment 'P2P UDP'
          
          # Enable firewall (non-interactive)
          echo "y" | ufw enable || true
          
          # Show status
          ufw status verbose
          
          echo "=== FIREWALL CONFIGURED FOR ALL STREAMS ==="
          echo "  - Stream A RPC: Internal (nginx proxy)"
          echo "  - Stream B Stratum: 3333/tcp (direct)"
          echo "  - Stream C Staking: Internal (nginx proxy)"
          echo "  - P2P: 30303/tcp, 30304/udp"
          EOF

      - name: Deploy to Devnet Server
        run: |
          # SSH with keepalive to prevent timeout during long builds
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@${{ env.DEVNET_SERVER }} << 'EOF'
          set -e
          
          cd /opt/pyrax
          
          COMPOSE_FILE="docker-compose.devnet.yml"
          
          echo "=== KILLING CONFLICTING PROCESSES ==="
          systemctl stop nginx 2>/dev/null || true
          systemctl stop apache2 2>/dev/null || true
          systemctl disable nginx 2>/dev/null || true
          systemctl disable apache2 2>/dev/null || true
          
          fuser -k 80/tcp 443/tcp 3000/tcp 3001/tcp 3002/tcp 3003/tcp 2>/dev/null || true
          sleep 2
          
          echo "=== STOPPING OLD CONTAINERS ==="
          docker compose -f $COMPOSE_FILE down --remove-orphans 2>/dev/null || true
          
          echo "=== REMOVING ALL PYRAX CONTAINERS ==="
          docker rm -f pyrax-node pyrax-website pyrax-faucet pyrax-docs pyrax-explorer pyrax-nginx pyrax-marketing pyrax-postgres pyrax-redis 2>/dev/null || true
          
          echo "=== REMOVING STALE NETWORKS ==="
          docker network rm pyrax_pyrax-network 2>/dev/null || true
          docker network prune -f 2>/dev/null || true
          
          echo "=== BUILDING IMAGES (with cache) ==="
          docker compose -f $COMPOSE_FILE build
          
          echo "=== STARTING ALL SERVICES ==="
          docker compose -f $COMPOSE_FILE up -d
          
          echo "=== WAITING FOR HEALTH CHECKS ==="
          sleep 15
          
          echo "=== SERVICE STATUS ==="
          docker compose -f $COMPOSE_FILE ps
          
          echo "=== NGINX LOGS ==="
          docker logs pyrax-nginx --tail=20 2>&1 || echo "Nginx not running yet"
          
          echo "=== TESTING CONNECTIVITY ==="
          curl -sf http://localhost:80 -o /dev/null && echo "Port 80: OK" || echo "Port 80: FAILED"
          
          echo "=== LISTENING PORTS ==="
          netstat -tlnp | grep -E ':80|:443|:3000|:3001|:3002|:3003' || ss -tlnp | grep -E ':80|:443|:3000|:3001|:3002|:3003'
          
          echo "=== CLEANUP OLD IMAGES ==="
          docker image prune -f
          
          echo "=== CREATING SYSTEMD SERVICE FOR AUTO-START ==="
          cat > /etc/systemd/system/pyrax-devnet.service << 'SERVICE'
          [Unit]
          Description=PYRAX Devnet Stack
          After=docker.service
          Requires=docker.service
          
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/pyrax
          ExecStart=/usr/bin/docker compose -f docker-compose.devnet.yml up -d
          ExecStop=/usr/bin/docker compose -f docker-compose.devnet.yml down
          
          [Install]
          WantedBy=multi-user.target
          SERVICE
          
          systemctl daemon-reload
          systemctl enable pyrax-devnet.service
          
          echo "=== PYRAX DEVNET WILL AUTO-START ON BOOT ==="
          EOF

      - name: Health Check - All Services
        run: |
          sleep 20
          echo "========================================"
          echo "   PYRAX DEVNET HEALTH CHECK"
          echo "========================================"
          
          echo ""
          echo "=== WEB SERVICES ==="
          curl -sf -o /dev/null https://pyrax-devnet.org && echo "✓ Website: OK" || echo "✗ Website: FAILED"
          curl -sf -o /dev/null https://docs.pyrax-devnet.org && echo "✓ Docs: OK" || echo "✗ Docs: FAILED"
          curl -sf -o /dev/null https://explorer.pyrax-devnet.org && echo "✓ Explorer: OK" || echo "✗ Explorer: FAILED"
          curl -sf -o /dev/null https://faucet.pyrax-devnet.org && echo "✓ Faucet: OK" || echo "✗ Faucet: FAILED"
          curl -sf -o /dev/null https://marketing.pyrax-devnet.org && echo "✓ Marketing: OK" || echo "✗ Marketing: FAILED"
          
          echo ""
          echo "=== STREAM A - BLAKE3 RPC ==="
          STREAM_A=$(curl -sf -X POST https://rpc.pyrax-devnet.org \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"pyrax_chainId","params":[],"id":1}' 2>/dev/null)
          if echo "$STREAM_A" | grep -q '"result"'; then
            CHAIN_ID=$(echo "$STREAM_A" | grep -o '"result":[0-9]*' | cut -d: -f2)
            echo "✓ Stream A RPC: OK (Chain ID: $CHAIN_ID)"
          else
            echo "✗ Stream A RPC: FAILED"
          fi
          
          echo ""
          echo "=== STREAM B - KAWPOW STRATUM ==="
          # Check if stratum port is listening (can't fully test without miner)
          nc -zv ${{ env.DEVNET_SERVER }} 3333 -w 3 && echo "✓ Stream B Stratum: Port 3333 OPEN" || echo "⚠ Stream B Stratum: Port 3333 not reachable (may need DNS propagation)"
          
          echo ""
          echo "=== STREAM C - ZK STAKING ==="
          STREAM_C=$(curl -s --max-time 10 -X POST https://staking.pyrax-devnet.org \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"pyrax_getStakingStats","params":[],"id":1}' 2>/dev/null || echo "")
          if echo "$STREAM_C" | grep -q '"result"'; then
            echo "✓ Stream C Staking: OK"
          else
            echo "⚠ Stream C Staking: Not responding (DNS may need propagation for staking.pyrax-devnet.org)"
            echo "  Add DNS A record: staking -> 209.38.137.105 (Proxied)"
          fi
          
          echo ""
          echo "========================================"
          echo "   DEPLOYMENT COMPLETE"
          echo "========================================"
          echo ""
          echo "Endpoints:"
          echo "  Website:  https://pyrax-devnet.org"
          echo "  RPC:      https://rpc.pyrax-devnet.org"
          echo "  Stratum:  stratum+tcp://stratum.pyrax-devnet.org:3333"
          echo "  Staking:  https://staking.pyrax-devnet.org"
          echo "  Explorer: https://explorer.pyrax-devnet.org"
          echo "  Faucet:   https://faucet.pyrax-devnet.org"
          echo "  Docs:     https://docs.pyrax-devnet.org"
          echo ""
