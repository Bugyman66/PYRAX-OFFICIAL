name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.51)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/cli-v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: cli-v${{ steps.get_version.outputs.version }}
          name: Inferno CLI v${{ steps.get_version.outputs.version }}
          body: |
            ## 🔥 Inferno CLI v${{ steps.get_version.outputs.version }}
            
            Terminal-based node management for PYRAX blockchain.
            
            ### Installation
            
            **Quick Install (Linux/macOS/WSL2):**
            ```bash
            curl -fsSL https://get.pyrax-devnet.org/cli | bash
            ```
            
            **Homebrew (macOS/Linux):**
            ```bash
            brew tap pyrax-chain/tap
            brew install inferno
            ```
            
            **Manual Download:**
            Download the appropriate binary for your platform below.
            
            ### Features
            - Multi-instance node management
            - Automatic port conflict resolution
            - Docker container support
            - SSH remote node management
            - Web-based monitoring dashboard
            - Live log streaming
            
            ### Getting Started
            ```bash
            inferno init      # Initialize node
            inferno start     # Start node
            inferno dashboard # Open web dashboard
            ```
            
            See [INSTALL-CLI.md](https://github.com/PYRAX-Chain/PYRAX-OFFICIAL/blob/main/docs/INSTALL-CLI.md) for detailed instructions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: inferno
            asset_name: inferno-cli-${{ needs.create-release.outputs.version }}-linux-x86_64.tar.gz

          # Linux ARM64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact_name: inferno
            asset_name: inferno-cli-${{ needs.create-release.outputs.version }}-linux-aarch64.tar.gz

          # macOS x86_64 (Intel) - use macos-13 which is Intel-native
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: inferno
            asset_name: inferno-cli-${{ needs.create-release.outputs.version }}-darwin-x86_64.tar.gz

          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: inferno
            asset_name: inferno-cli-${{ needs.create-release.outputs.version }}-darwin-aarch64.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libssh2-1-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: inferno-cli
          key: ${{ matrix.target }}

      - name: Build
        run: |
          cd inferno-cli
          cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        run: |
          cd inferno-cli/target/${{ matrix.target }}/release
          tar -czvf ${{ matrix.asset_name }} ${{ matrix.artifact_name }}
          mv ${{ matrix.asset_name }} ../../../../

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: cli-v${{ needs.create-release.outputs.version }}
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: inferno-cli/Dockerfile
          push: true
          tags: |
            ghcr.io/pyrax-chain/inferno-node:latest
            ghcr.io/pyrax-chain/inferno-node:${{ needs.create-release.outputs.version }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-homebrew:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          
          # Download all assets to calculate SHA256
          curl -fsSL -o darwin-aarch64.tar.gz \
            "https://github.com/PYRAX-Chain/PYRAX-OFFICIAL/releases/download/cli-v${VERSION}/inferno-cli-${VERSION}-darwin-aarch64.tar.gz"
          curl -fsSL -o darwin-x86_64.tar.gz \
            "https://github.com/PYRAX-Chain/PYRAX-OFFICIAL/releases/download/cli-v${VERSION}/inferno-cli-${VERSION}-darwin-x86_64.tar.gz"
          curl -fsSL -o linux-aarch64.tar.gz \
            "https://github.com/PYRAX-Chain/PYRAX-OFFICIAL/releases/download/cli-v${VERSION}/inferno-cli-${VERSION}-linux-aarch64.tar.gz"
          curl -fsSL -o linux-x86_64.tar.gz \
            "https://github.com/PYRAX-Chain/PYRAX-OFFICIAL/releases/download/cli-v${VERSION}/inferno-cli-${VERSION}-linux-x86_64.tar.gz"

      - name: Calculate SHA256 hashes
        id: sha256
        run: |
          echo "darwin_arm64=$(sha256sum darwin-aarch64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "darwin_x64=$(sha256sum darwin-x86_64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(sha256sum linux-aarch64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_x64=$(sha256sum linux-x86_64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          
          cat > inferno-cli/homebrew/inferno.rb << 'EOF'
          class Inferno < Formula
            desc "Terminal-based node management for PYRAX blockchain"
            homepage "https://github.com/PYRAX-Chain/PYRAX-OFFICIAL"
            version "${{ needs.create-release.outputs.version }}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/PYRAX-Chain/PYRAX-OFFICIAL/releases/download/cli-v#{version}/inferno-cli-#{version}-darwin-aarch64.tar.gz"
                sha256 "${{ steps.sha256.outputs.darwin_arm64 }}"
              end
              on_intel do
                url "https://github.com/PYRAX-Chain/PYRAX-OFFICIAL/releases/download/cli-v#{version}/inferno-cli-#{version}-darwin-x86_64.tar.gz"
                sha256 "${{ steps.sha256.outputs.darwin_x64 }}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/PYRAX-Chain/PYRAX-OFFICIAL/releases/download/cli-v#{version}/inferno-cli-#{version}-linux-aarch64.tar.gz"
                sha256 "${{ steps.sha256.outputs.linux_arm64 }}"
              end
              on_intel do
                url "https://github.com/PYRAX-Chain/PYRAX-OFFICIAL/releases/download/cli-v#{version}/inferno-cli-#{version}-linux-x86_64.tar.gz"
                sha256 "${{ steps.sha256.outputs.linux_x64 }}"
              end
            end

            def install
              bin.install "inferno"
              generate_completions_from_executable(bin/"inferno", "completions")
            end

            test do
              assert_match "Inferno CLI", shell_output("#{bin}/inferno --version")
            end
          end
          EOF

      - name: Commit updated formula
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add inferno-cli/homebrew/inferno.rb
          git commit -m "chore: update Homebrew formula to v${{ needs.create-release.outputs.version }}" || true
          git push || true

  upload-install-script:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload install script
        uses: softprops/action-gh-release@v1
        with:
          tag_name: cli-v${{ needs.create-release.outputs.version }}
          files: inferno-cli/install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
