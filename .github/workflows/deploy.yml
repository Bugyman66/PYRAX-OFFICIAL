# PYRAX Auto-Deploy Workflow
# Automatically deploys to Digital Ocean droplet on push to main

name: Deploy to Production

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all, website, faucet, docs, explorer)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - website
          - faucet
          - docs
          - explorer

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      faucet: ${{ steps.filter.outputs.faucet }}
      docs: ${{ steps.filter.outputs.docs }}
      explorer: ${{ steps.filter.outputs.explorer }}
      deployment: ${{ steps.filter.outputs.deployment }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'pyrax-website/**'
            faucet:
              - 'pyrax-faucet/**'
            docs:
              - 'pyrax-docs/**'
            explorer:
              - 'pyrax-explorer/**'
            deployment:
              - 'docker-compose.yml'
              - 'deployment/**'

  deploy:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Sync repository to server
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'target' \
            --exclude 'build' \
            ./ root@${{ secrets.DROPLET_IP }}:/opt/pyrax/

      - name: Create .env file on server
        run: |
          ssh root@${{ secrets.DROPLET_IP }} << 'EOF'
          cat > /opt/pyrax/.env << 'ENVFILE'
          NETWORK=${{ vars.NETWORK || 'testnet' }}
          NEXT_PUBLIC_RPC_URL=${{ vars.NEXT_PUBLIC_RPC_URL || 'https://rpc.testnet.pyrax.org' }}
          NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.testnet.pyrax.org' }}
          FAUCET_PRIVATE_KEY=${{ secrets.FAUCET_PRIVATE_KEY }}
          FAUCET_AMOUNT=${{ vars.FAUCET_AMOUNT || '10' }}
          RATE_LIMIT_HOURS=${{ vars.RATE_LIMIT_HOURS || '24' }}
          RPC_URL=${{ vars.RPC_URL || 'http://localhost:8545' }}
          ENVFILE
          EOF

      - name: Fast Deploy with Caching
        run: |
          ssh root@${{ secrets.DROPLET_IP }} << 'EOF'
          cd /opt/pyrax
          
          COMPOSE_FILE="docker-compose.testnet.yml"
          
          echo "=== KILLING CONFLICTING PROCESSES ==="
          # Stop host nginx/apache if running
          systemctl stop nginx 2>/dev/null || true
          systemctl stop apache2 2>/dev/null || true
          systemctl disable nginx 2>/dev/null || true
          systemctl disable apache2 2>/dev/null || true
          
          # Kill any processes using our ports (including 80 and 443)
          fuser -k 80/tcp 443/tcp 3000/tcp 3001/tcp 3002/tcp 3003/tcp 2>/dev/null || true
          sleep 2
          
          echo "=== STOPPING OLD CONTAINERS ==="
          docker compose -f $COMPOSE_FILE down --remove-orphans 2>/dev/null || true
          docker rm -f pyrax-website pyrax-faucet pyrax-docs pyrax-explorer pyrax-nginx 2>/dev/null || true
          
          echo "=== BUILDING IMAGES (with cache) ==="
          docker compose -f $COMPOSE_FILE build
          
          echo "=== STARTING ALL SERVICES ==="
          docker compose -f $COMPOSE_FILE up -d
          
          echo "=== WAITING FOR HEALTH CHECKS ==="
          sleep 15
          
          echo "=== SERVICE STATUS ==="
          docker compose -f $COMPOSE_FILE ps
          
          echo "=== NGINX LOGS ==="
          docker logs pyrax-nginx --tail=10 2>&1 || echo "Nginx not running yet"
          
          echo "=== CLEANUP OLD IMAGES ==="
          docker image prune -f
          EOF

      - name: Health Check
        run: |
          sleep 15
          echo "Checking website..."
          curl -f https://testnet.pyrax.org || echo "Website check failed"
          echo "Checking docs..."
          curl -f https://docs.testnet.pyrax.org || echo "Docs check failed"
          echo "Checking explorer..."
          curl -f https://explorer.testnet.pyrax.org || echo "Explorer check failed"
          echo "Checking faucet..."
          curl -f https://faucet.testnet.pyrax.org || echo "Faucet check failed"

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify on success
        if: ${{ needs.deploy.result == 'success' }}
        run: echo "✅ Deployment successful!"

      - name: Notify on failure
        if: ${{ needs.deploy.result == 'failure' }}
        run: |
          echo "❌ Deployment failed!"
          exit 1
