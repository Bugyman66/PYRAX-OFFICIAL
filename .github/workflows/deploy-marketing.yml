name: Deploy PYRAX Proofing Hub

on:
  push:
    branches: [main, development]
    paths:
      - 'pyrax-core-marketing/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pyrax-chain/pyrax-marketing
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./pyrax-core-marketing
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Marketing App
        run: |
          ssh root@${{ secrets.DROPLET_IP }} << 'ENDSSH'
          set -e
          echo "=== PYRAX Marketing - Deploy ==="
          
          # 1. DATABASE SETUP (PostgreSQL must be installed on host)
          echo "Setting up PostgreSQL..."
          sudo -u postgres psql -c "CREATE DATABASE pyrax_marketing;" 2>/dev/null || echo "DB exists"
          sudo -u postgres psql -c "CREATE USER pyrax_marketing WITH PASSWORD '${{ secrets.MARKETING_DB_PASSWORD }}';" 2>/dev/null || echo "User exists"  
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE pyrax_marketing TO pyrax_marketing;" 2>/dev/null || true
          sudo -u postgres psql -d pyrax_marketing -c "GRANT ALL ON SCHEMA public TO pyrax_marketing;" 2>/dev/null || true
          sudo -u postgres psql -c "ALTER USER pyrax_marketing WITH PASSWORD '${{ secrets.MARKETING_DB_PASSWORD }}';" 2>/dev/null || true
          
          # 2. PULL AND DEPLOY CONTAINER
          echo "Deploying container..."
          echo ${{ secrets.GH_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/pyrax-chain/pyrax-marketing:latest
          
          docker stop pyrax-marketing 2>/dev/null || true
          docker rm pyrax-marketing 2>/dev/null || true
          
          # Use the same network as docker-compose (pyrax_pyrax-network)
          docker network create pyrax_pyrax-network 2>/dev/null || true
          
          docker run -d \
            --name pyrax-marketing \
            --restart unless-stopped \
            --network pyrax_pyrax-network \
            --network-alias marketing \
            -p 3004:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL="postgresql://pyrax_marketing:${{ secrets.MARKETING_DB_PASSWORD }}@host.docker.internal:5432/pyrax_marketing" \
            -e NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" \
            -e NEXT_PUBLIC_APP_URL="https://marketing.pyrax.org" \
            -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            -e GOOGLE_REDIRECT_URI="https://marketing.pyrax.org/api/auth/google/callback" \
            -e BREVO_API_KEY="${{ secrets.BREVO_API_KEY }}" \
            -e BREVO_SENDER_EMAIL="pyrax-proof-hub@pyrax.org" \
            -e BREVO_SENDER_NAME="PYRAX Proofing Hub" \
            -e NEXT_PUBLIC_APP_NAME="PYRAX Proofing Hub" \
            -e INTERNAL_EMAIL_DOMAIN="pyrax.org" \
            -e MAGIC_LINK_EXPIRY_MINUTES="15" \
            -e SESSION_EXPIRY_DAYS="30" \
            --add-host=host.docker.internal:host-gateway \
            ghcr.io/pyrax-chain/pyrax-marketing:latest
          
          # 3. RUN MIGRATIONS
          echo "Running migrations..."
          sleep 10
          docker exec pyrax-marketing npx prisma migrate deploy --schema=./prisma/schema.prisma 2>/dev/null || \
          docker exec pyrax-marketing npx prisma db push --schema=./prisma/schema.prisma 2>/dev/null || \
          echo "Migration completed or skipped"
          
          # 4. UPDATE NGINX (Docker nginx container)
          echo "Updating nginx config..."
          cd /opt/pyrax
          git pull origin development 2>/dev/null || true
          
          # Copy updated nginx config into container and reload
          if docker ps | grep -q pyrax-nginx; then
            docker cp /opt/pyrax/deployment/nginx/docker.conf pyrax-nginx:/etc/nginx/nginx.conf
            docker exec pyrax-nginx nginx -t && docker exec pyrax-nginx nginx -s reload
            echo "Nginx config updated and reloaded"
          else
            echo "Nginx container not running - starting with docker-compose..."
            docker compose up -d nginx 2>/dev/null || echo "Will need full deploy for nginx"
          fi
          
          # 5. VERIFY
          echo "Verifying..."
          sleep 5
          docker ps | grep pyrax-marketing || echo "Container not listed"
          docker logs pyrax-marketing --tail=20 2>&1 || true
          curl -sf http://localhost:3004 > /dev/null && echo "✅ App responding on port 3004" || echo "⚠️ App still starting..."
          
          echo "=== Deploy Complete ==="
          ENDSSH

      - name: Health Check
        run: |
          sleep 10
          curl -sf https://marketing.pyrax.org > /dev/null && echo "✅ marketing.pyrax.org is live" || echo "⚠️ Site may still be starting"
